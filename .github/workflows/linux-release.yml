# The Linux half of a release: both binaries build in parallel through the
# shared cache workflow, and the packages are assembled here from what it
# produced. Packaging stays outside nix: the artifacts are self-contained, and
# the distribution tools are the ones a packager would use by hand.

name: Linux release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  newest:
    uses: ./.github/workflows/nix-cache.yml
    secrets: inherit
    with:
      isLegacy: false
      isRelease: true

  legacy:
    uses: ./.github/workflows/nix-cache.yml
    secrets: inherit
    with:
      isLegacy: true
      isRelease: true

  packages:
    name: Packages
    needs: [newest, legacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools

      - name: Build the deb
        run: ./packaging/linux/package-deb.sh artifacts/axlauncher dist

      - name: Build the rpm
        run: ./packaging/linux/package-rpm.sh artifacts/axlauncher dist

      - name: Build the AppImage
        run: |
          mkdir -p portable
          tar --zstd -xf artifacts/axlauncher-portable-linux-x86_64.tar.zst -C portable
          ./packaging/linux/package-appimage.sh portable dist

      - name: Upload the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axlauncher-linux-packages
          path: dist/
