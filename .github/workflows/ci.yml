name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    uses: ./.github/workflows/repo-check.yml

  rust:
    name: Desktop Rust (${{ matrix.os }})
    needs: repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare desktop Rust
        uses: ./.github/actions/setup-desktop-rust
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.150

      - name: Install Node.js for embedded desktop builds
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Lint the Rust workspace
        run: node scripts/desktop.ts exec cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run desktop workspace tests
        run: node scripts/desktop.ts exec cargo nextest run --workspace --profile ci --locked --no-tests=fail

      - name: Exercise both embedded worker libraries
        run: node scripts/desktop.ts smoke

  # The architecture gate covers the Linux host target with default features.
  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare desktop Rust
        uses: ./.github/actions/setup-desktop-rust
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Add rust-analyzer
        run: rustup component add rust-analyzer

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Check the architecture
        run: node scripts/architecture.ts --allow .deslop-please.allow

  # The flake builds the artifact this project ships for Linux and pushes it to
  # the public binary cache, so a user substitutes instead of compiling.
  nix:
    name: Nix build
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_AUTH_TOKEN: ${{ secrets.CACHIX_CACHE_AUTH_TOKEN }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Set up the release cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: axlmc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push is explicit below: only the binaries users may fetch belong in the cache.
          skipPush: true

      - name: Set up the build cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ env.CACHIX_CACHE_AUTH_TOKEN != '' }}
        with:
          name: axlmc-cache
          authToken: ${{ secrets.CACHIX_CACHE_AUTH_TOKEN }}
          skipPush: true

      - name: Build the crate dependencies
        run: nix build --print-out-paths .#axlauncher-cargo-deps

      - name: Publish the crate dependencies
        # Build output goes to its own cache: seeded from every push so a pull
        # request substitutes the crane build instead of recompiling the
        # workspace, and never mixed with the release artifacts.
        if: ${{ env.CACHIX_CACHE_AUTH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: nix build --print-out-paths .#axlauncher-cargo-deps | cachix push axlmc-cache

      - name: Build both binaries
        run: nix build --print-out-paths .#axlauncher .#axlauncher-newest .#axlauncher-legacy

      - name: Run the flake checks
        run: nix flake check

  ci-result:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [repository, rust, architecture, nix]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        shell: bash
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          printf '| Checks | Result |\n| --- | --- |\n| Repository | %s |\n| Desktop Rust | %s |\n| Architecture | %s |\n| Nix build | %s |\n' \
            "$REPOSITORY_RESULT" "$RUST_RESULT" "$ARCHITECTURE_RESULT" "$NIX_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$REPOSITORY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$ARCHITECTURE_RESULT" = success
          test "$NIX_RESULT" = success
