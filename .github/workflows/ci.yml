name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    uses: ./.github/workflows/repo-check.yml

  rust:
    name: Desktop Rust (${{ matrix.os }})
    needs: repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare desktop Rust
        uses: ./.github/actions/setup-desktop-rust
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.150

      - name: Install Node.js for embedded desktop builds
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Lint the Rust workspace
        run: node scripts/desktop.ts exec cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run desktop workspace tests
        run: node scripts/desktop.ts exec cargo nextest run --workspace --profile ci --locked --no-tests=fail

      - name: Exercise both embedded worker libraries
        run: node scripts/desktop.ts smoke

  # The architecture gate covers the Linux host target with default features.
  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare desktop Rust
        uses: ./.github/actions/setup-desktop-rust
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Add rust-analyzer
        run: rustup component add rust-analyzer

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Check the architecture
        run: node scripts/architecture.ts --allow .deslop-please.allow

  ci-result:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [repository, rust, architecture]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        shell: bash
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
        run: |
          printf '| Checks | Result |\n| --- | --- |\n| Repository | %s |\n| Desktop Rust | %s |\n| Architecture | %s |\n' \
            "$REPOSITORY_RESULT" "$RUST_RESULT" "$ARCHITECTURE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$REPOSITORY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$ARCHITECTURE_RESULT" = success
