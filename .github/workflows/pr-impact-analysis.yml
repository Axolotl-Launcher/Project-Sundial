name: PR impact

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze impact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      available: ${{ steps.scripts.outputs.available }}
    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check whether the trusted scripts are available
        id: scripts
        run: |
          if [ -f scripts/impact-pr.ts ] && [ -f scripts/post-impact-comment.ts ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base branch does not contain the impact scripts yet. Merge the workflow, then re-run this check."
          fi

      - name: Check out pull request as data
        if: steps.scripts.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: steps.scripts.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # CodeGraph ships its own Node runtime in a per-platform package, so it
      # installs beside the runner rather than into this project's dependencies.
      # Keeping it out of package.json also keeps its release cadence away from
      # the pnpm lockfile and the minimum release age.
      - name: Install CodeGraph in an isolated home
        if: steps.scripts.outputs.available == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codegraph"
          npm install --prefix "$RUNNER_TEMP/codegraph" --no-save @colbymchenry/codegraph@1.6.4
          echo "CODEGRAPH_COMMAND=$RUNNER_TEMP/codegraph/node_modules/.bin/codegraph" >> "$GITHUB_ENV"
          echo 'CODEGRAPH_ARGS=[]' >> "$GITHUB_ENV"
          echo "CODEGRAPH_TELEMETRY=0" >> "$GITHUB_ENV"

      - name: Build the code graph
        if: steps.scripts.outputs.available == 'true'
        env:
          CODEGRAPH_TELEMETRY: "0"
        run: |
          cd .pr
          "$CODEGRAPH_COMMAND" init

      - name: Analyze the pull request
        if: steps.scripts.outputs.available == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IMPACT_OUTPUT: ${{ runner.temp }}/impact
          IMPACT_WORKTREE: ${{ github.workspace }}/.pr
          CODEGRAPH_TELEMETRY: "0"
        run: node scripts/impact-pr.ts

      - name: Upload the impact report
        if: steps.scripts.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-impact
          path: ${{ runner.temp }}/impact
          if-no-files-found: error
          retention-days: 7

  comment:
    name: Publish impact comment
    needs: analyze
    if: needs.analyze.result == 'success' && needs.analyze.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download the impact report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-impact
          path: ${{ runner.temp }}/impact

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMPACT_REPORT: ${{ runner.temp }}/impact/impact.md
        run: node scripts/post-impact-comment.ts
