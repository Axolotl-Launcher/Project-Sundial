# Builds the newest binary from `main` every eight hours so a broken build is
# noticed between releases. It fills the build cache and uploads the tree; it
# never tags, never creates a release and never writes to the release cache.

name: Canary

on:
  schedule:
    # Every eight hours, UTC. GitHub runs scheduled workflows from the default
    # branch only, and may start them late under load.
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  newest:
    uses: ./.github/workflows/nix-cache.yml
    secrets: inherit
    with:
      isLegacy: false
      isRelease: false

  # `canary.yml` can carry a second job with `isLegacy: true` when the build
  # cache has room to keep the packaging binary warm as well.
