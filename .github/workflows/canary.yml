# Builds both binaries from `main` every eight hours so a broken build is noticed
# between releases. It fills the build cache and uploads the trees; it never
# tags, never creates a release and never writes to the release cache.
#
# Both binaries run here on purpose: they share no build output, so a cache that
# only holds one of them still leaves the other compiling from scratch.

name: Canary

on:
  schedule:
    # Every eight hours, UTC. GitHub runs scheduled workflows from the default
    # branch only, and may start them late under load.
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  newest:
    uses: ./.github/workflows/nix-cache.yml
    secrets: inherit
    with:
      isLegacy: false
      isRelease: false

  legacy:
    uses: ./.github/workflows/nix-cache.yml
    secrets: inherit
    with:
      isLegacy: true
      isRelease: false
