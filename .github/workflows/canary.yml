# Builds the newest binary from `main` every eight hours, so a broken build is
# noticed before a release. It publishes to the build cache and nothing else: no
# tag, no release, no release-cache entry.

name: Canary

on:
  schedule:
    # Every eight hours, UTC. GitHub runs scheduled workflows from the default
    # branch only, and may start them late under load.
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    name: Newest binary
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CACHIX_CACHE_AUTH_TOKEN: ${{ secrets.CACHIX_CACHE_AUTH_TOKEN }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Set up the build cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ env.CACHIX_CACHE_AUTH_TOKEN != '' }}
        with:
          name: axlmc-cache
          authToken: ${{ secrets.CACHIX_CACHE_AUTH_TOKEN }}
          skipPush: true

      - name: Build the newest binary
        run: nix build --out-link newest .#axlauncher-newest

      - name: Exercise worker dispatch
        # The binary embeds both worker libraries and re-executes itself; an
        # invalid worker name must reach that path and fail cleanly.
        run: |
          output=$(./newest/bin/axlauncher --axlauncher-worker bogus /tmp/x 2>&1 || true)
          echo "$output"
          case "$output" in
            *StartupFailed*) ;;
            *) echo "worker dispatch did not run" >&2; exit 1 ;;
          esac

      - name: Publish to the build cache
        # `newest` from `main` is not a release artifact, so it stays out of the
        # release cache.
        if: ${{ env.CACHIX_CACHE_AUTH_TOKEN != '' }}
        run: |
          nix build --print-out-paths .#axlauncher-cargo-deps .#axlauncher-newest |
            cachix push axlmc-cache

      - name: Archive the binary
        run: tar --zstd -cf axlauncher-canary-linux-x86_64.tar.zst -C newest .

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axlauncher-canary-linux-x86_64
          path: axlauncher-canary-linux-x86_64.tar.zst
          retention-days: 14
