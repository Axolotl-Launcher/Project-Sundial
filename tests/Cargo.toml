[package]
name = "axlauncher_policy_tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Repository-wide policy tests that no lint can express"
repository.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[test]]
name = "real_manifest"
path = "apps/core/launch/tests/real_manifest.rs"

[dev-dependencies]
axlauncher_content = { workspace = true }
axlauncher_install = { workspace = true }
axlauncher_launch = { workspace = true }
axlauncher_spi = { workspace = true }
axlauncher_state = { workspace = true }
axlauncher_storage = { workspace = true }
axlauncher_worker = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
