# Fast local hooks. They cover what is cheap to fix while a commit is still
# local: whitespace and encoding, files that must parse, formatting, and commit
# metadata. Anything that builds the workspace or scans every file (clippy,
# tests, cargo deny, cargo shear, typos, REUSE, tsc, ESLint) belongs to CI; run
# `pnpm check` for most of that gate locally on demand.

# Install all three shims; without this prek only installs pre-commit.
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# A hook without `stages` runs in every installed stage. Keep the file checks
# at pre-commit and let the commit-metadata hooks opt into the other two.
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  # Encoding and whitespace. Runs at pre-commit so a fix is one commit, not a
  # separate cleanup commit after review.
  #
  # Some builtin hooks default to pre-push as well; fixing a file after the
  # commit exists is pointless, so pin those to pre-commit.
  { id = "trailing-whitespace", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "fix-byte-order-marker" },

  # Files that break on another platform or in another checkout.
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks", stages = ["pre-commit"] },
  { id = "forbid-new-submodules" },
  { id = "check-added-large-files", args = ["--maxkb=4096"], stages = ["pre-commit"] },

  # Merge artifacts and secrets.
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },

  # Structured files must parse. JSON has no comments, and a misplaced one has
  # broken this repository before.
  { id = "check-json" },
  # turbo.jsonc uses trailing commas, which turbo accepts and this hook does
  # not; the file is validated by `turbo ls` in CI instead.
  { id = "check-jsonc", exclude = '''^turbo\.jsonc$''' },
  { id = "check-toml" },
  # pnpm-lock.yaml is a multi-document stream, which the single-document check
  # rejects. pnpm verifies it on install.
  { id = "check-yaml", exclude = '''^pnpm-lock\.yaml$''' },
  { id = "check-xml" },

  # Commit message policy. AGENTS.md requires a DCO sign-off and a Conventional
  # Commit subject, and both are checkable rather than advisory.
  # Only the DCO sign-off is mandatory; "Assisted-by" is expected on agent
  # commits but a human writing the change outright does not need it.
  #
  # The subject's Conventional Commit shape is not checked here: this hook only
  # reads trailers, and the subject is the message's first line, not a trailer.
  # AGENTS.md states the subject format, and review enforces it.
  { id = "check-commit-trailers", args = ['''--require=Signed-off-by=^.+ <.+@.+>$'''], stages = ["commit-msg", "pre-push"] },
  # Commit signature verification is temporarily disabled.
  # { id = "check-signed-commit", stages = ["pre-push"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "english-commit-message", name = "commit message is English", language = "system", entry = "node scripts/check-commit-message.ts", pass_filenames = true, stages = ["commit-msg"] },
  # Formatters only. CI runs the same checks, but catching a formatting
  # failure here costs a second instead of a round trip.
  { id = "format-rust", name = "cargo fmt", language = "system", entry = "cargo fmt --all --check", pass_filenames = false, always_run = true },
  { id = "format-toml", name = "tombi format", language = "system", entry = "tombi format --check", pass_filenames = false, always_run = true },
  { id = "file-length", name = "code file line limit", language = "system", entry = "node scripts/check-file-length.ts", files = "[.](rs|ts|tsx|js|jsx|mjs|cjs)$", stages = ["pre-commit"] },
]
