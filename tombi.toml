[files]
exclude = ["target/", "**/node_modules/"]

# Pin Cargo.toml validation to a fixed schema version, so formatting choices
# stay stable across tombi releases.
[[schemas]]
toml-version = "v1.0.0"
path = "tombi://www.schemastore.org/cargo.json"
include = ["Cargo.toml"]
