# typos spellchecker. Only exceptions live here; add a word only after typos
# flags it on text that is genuinely correct.
[files]
extend-exclude = [
  "target/",
  "node_modules/",
  "pnpm-lock.yaml",
  "Cargo.lock",
]

[default]
extend-ignore-re = [
  # Hex ids, GPUI element ids and hashes are not prose.
  "[0-9a-f]{7,}",
]

[default.extend-words]
# The domain is a Minecraft launcher working alongside ../Axolotl, whose own
# _typos.toml keeps a similar list.
axolotl = "axolotl"
superlogical = "superlogical"
gpui = "gpui"

[default.extend-identifiers]
# GPUI's own spellings that are not English words.
GPUI = "GPUI"
