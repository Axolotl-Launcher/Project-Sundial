[workspace]
resolver = "3"
members = ["apps/core", "apps/ui", "platforms/linux", "platforms/windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Axolotl-Launcher/Axolotl-Superlogical"

[workspace.dependencies]
# gpui 0.2.2 即 Zed 仓库 crates/gpui 在 crates.io 上的官方发布版本。
# 若要跟进 zed-industries/zed main 分支，需要改用 git 依赖，并接受其
# 未发布的内部 crate（如 gpui_platform）带来的不稳定性。
gpui = "0.2.2"
superlogical_core = { path = "apps/core" }
superlogical_ui = { path = "apps/ui" }
