[workspace]
resolver = "3"
members = [
    "apps/core",
    "apps/frontend",
    "apps/ui",
    "platforms/linux",
    "platforms/windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Axolotl-Launcher/Axolotl-Superlogical"

[workspace.dependencies]
# gpui-kit 0.10.0 一揽子锁定 GPUI 家族（gpui-pre 0.3.12 快照、gpui-base、
# gpui-component 与 Lucide 资源），是 Zed crates/gpui 的长期跟进快照。
# 升级时须整体升级 gpui-kit，不要单独改 gpui-pre。
gpui-kit = "0.10.0"
superlogical_core = { path = "apps/core" }
superlogical_frontend = { path = "apps/frontend" }
superlogical_ui = { path = "apps/ui" }
