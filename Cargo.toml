[workspace]
resolver = "3"
members = [
  "apps/core",
  "apps/core/content",
  "apps/core/domain",
  "apps/core/download_engine",
  "apps/core/install",
  "apps/core/launch",
  "apps/core/loader",
  "apps/core/mod_metadata",
  "apps/core/network",
  "apps/core/observability",
  "apps/core/resources",
  "apps/core/scheduler",
  "apps/core/spi",
  "apps/core/state",
  "apps/core/storage",
  "apps/core/telemetry",
  "apps/frontend",
  "apps/plugins/modpack",
  "apps/ui",
  "platforms/linux",
  "platforms/macos",
  "platforms/windows",
  "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum supported Rust, kept equal to rust-toolchain.toml's channel and
# clippy.toml's msrv. 1.100.0 is the oldest version this workspace has actually
# been built with; raise it when you verify a newer one, never in advance.
rust-version = "1.100.0"
repository = "https://github.com/Axolotl-Launcher/Axolotl-2.0"
# GPL-3.0-only applies to every crate in this workspace.
license = "GPL-3.0-only"

[workspace.dependencies]
dirs = "6"
# gpui-kit 0.10.0 一揽子锁定 GPUI 家族（gpui-pre 0.3.12 快照、gpui-base、
# gpui-component 与 Lucide 资源），是 Zed crates/gpui 的长期跟进快照。
# 升级时须整体升级 gpui-kit，不要单独改 gpui-pre。
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Declared now so each system can start with what it needs. These mirror the
# reference launcher's runtime dependencies, chosen per system; the selection
# deliberately leaves out its Tauri shell, its internal crates, and everything
# that exists only to read another launcher's data (see AGENTS.md).

async-trait = "0.1.92"
dashmap = "6.2.1"
futures = "0.3.34"
parking_lot = "0.13.0"
# Async runtime and tasks: network, install, scheduler.
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

base64 = "0.23.1"
# Byte and text handling.
bytes = "1.12.2"
encoding_rs = "0.8.35"
unicode-normalization = "0.1.25"

crc32fast = "1.5.0"
hex = "0.4.3"
md-5 = "0.10.6"
# Hashing and identity: downloads, library verification, mod fingerprints.
sha1_smol = "1.0.1"
sha2 = "0.11.1"

flate2 = "1.1.11"
tar = "0.4.46"
xz2 = "0.1.7"
# Archives: native extraction and modpack distribution inputs.
zip = "9.8.1"

# Game metadata documents.
quick-xml = "0.41.0"
semver = "1.0.28"
toml = "1.2.2"

dunce = "1.0.5"
fs4 = "1.1.0"
notify = "9.0.0"
tempfile = "3.27.0"
trash = "5.4.0"
# Filesystem work beyond std.
walkdir = "2.5.1"

hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
# Networking.
http-body-util = "0.1.3"
hyper = "1"
hyper-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rustls = "0.23.46"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
webpki-roots = "1.0.12"

indicatif = "0.18.6"
# Observability.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Credentials in the platform store, for accounts.
keyring = "4.2.0"

axlauncher_content = { path = "apps/core/content" }
axlauncher_core = { path = "apps/core" }
axlauncher_domain = { path = "apps/core/domain" }
axlauncher_download_engine = { path = "apps/core/download_engine" }
axlauncher_frontend = { path = "apps/frontend" }
axlauncher_install = { path = "apps/core/install" }
axlauncher_launch = { path = "apps/core/launch" }
axlauncher_loader = { path = "apps/core/loader" }
axlauncher_mod_metadata = { path = "apps/core/mod_metadata" }
axlauncher_modpack = { path = "apps/plugins/modpack" }
axlauncher_network = { path = "apps/core/network" }
axlauncher_observability = { path = "apps/core/observability" }
axlauncher_resources = { path = "apps/core/resources" }
axlauncher_scheduler = { path = "apps/core/scheduler" }
axlauncher_spi = { path = "apps/core/spi" }
axlauncher_state = { path = "apps/core/state" }
axlauncher_storage = { path = "apps/core/storage" }
axlauncher_telemetry = { path = "apps/core/telemetry" }
axlauncher_ui = { path = "apps/ui" }
# Utility.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
itertools = "0.15.0"
regex = "1.13.2"
serde_with = "3.25.0"
shlex = "2.0.1"
sysinfo = "0.40.4"
thiserror = "2.0.21"
which = "8.0.6"

# Deliberately absent, with the reason, so a later reader does not add them by
# reflex: the reference launcher's Tauri stack (tauri, its plugins, wry), its
# internal crates (theseus, daedalus, launcher-*, path-util), and anything whose
# only purpose is importing another launcher's data (PCL, MultiMC, CurseForge
# pack import). A foreign format is converted by a separate tool.
#
# cargo-shear fails on a declared-but-unused dependency, so each entry above is
# a commitment to use it. Add one only when the system that needs it starts.

# Shared lint policy. Every crate must opt in with `[lints] workspace = true`,
# or none of these lints apply to it.
#
# The coding rules in AGENTS.md are enforced here wherever a lint can express
# them, so a reviewer does not have to police style by reading diffs.
[workspace.lints.clippy]
# Every lint suppression must state why.
allow_attributes_without_reason = "warn"
# Style and hygiene.
cloned_instead_of_copied = "warn"
# Misuse with no legitimate place here.
dbg_macro = "deny"
default_trait_access = "warn"
# Say what you mean with types and names, not magic numbers or one-letter
# bindings.
disallowed_names = "warn"
excessive_nesting = "warn"
explicit_iter_loop = "warn"
many_single_char_names = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
todo = "deny"
# Short, single-purpose functions and shallow nesting.
too_many_lines = "warn"
# Deliberately allowed: GPUI callbacks are large by nature.
type_complexity = "allow"
uninlined_format_args = "warn"
wildcard_dependencies = "warn"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_must_use = "deny"

# Reserved for the systems that will use them, declared ahead of implementation
# so each system starts from a known set. cargo-shear fails on a declared but
# unused dependency, so every entry here is an explicit, reviewable exception.
#
# This list is a to-do, not a policy: when a system starts using one of these
# names, delete its line. The guard still catches a dependency neither used nor
# listed.
[workspace.metadata.cargo-shear]
ignored = [
  "async-trait",
  "chrono",
  "crc32fast",
  "dashmap",
  "dunce",
  "encoding_rs",
  "flate2",
  "fs4",
  "indicatif",
  "itertools",
  "notify",
  "parking_lot",
  "regex",
  "rustls",
  "semver",
  "serde_with",
  "shlex",
  "sysinfo",
  "tar",
  "toml",
  "tracing",
  "tracing-subscriber",
  "trash",
  "walkdir",
  "webpki-roots",
  "which",
]

# Development keeps line tables but skips variable-level debug info: enough for
# a backtrace, materially faster to build and link.
[profile.dev]
debug = 1

# Release stays small and stripped. The default is `lto = false` so local
# release builds stay quick; tagged builds can turn on fat LTO through
# CARGO_PROFILE_RELEASE_LTO.
[profile.release]
opt-level = "s"
strip = true
lto = false

# CI tests skip optimization and debug information.
[profile.ci]
inherits = "release"
opt-level = 0
debug = false
lto = "off"
