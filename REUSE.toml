# REUSE 3.3 configuration.
#
# Most files carry their own SPDX tags. This file covers exceptions such as
# the root README, generated lockfiles, and formats without comment syntax.

version = 1

# The root README contains only the project title.
[[annotations]]
path = "README.md"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "Cargo.lock"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "pnpm-lock.yaml"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# JSON cannot carry comments. turbo.jsonc is listed separately below because it
# is JSONC and does accept `//`.
[[annotations]]
path = ["package.json", "**/package.json", "tsconfig.json"]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# Dotfiles whose tooling rejects leading comments (npm reads .npmrc strictly as
# key=value) or that are matched by exact name in several places.
[[annotations]]
path = [".npmrc", ".editorconfig", ".gitattributes", ".gitignore"]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# deslop-please rewrites this file from scratch on --update-allow, so a header
# inside it would be lost.
[[annotations]]
path = ".deslop-please.allow"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# XML: a comment before the XML declaration is illegal, so the bundle metadata
# carries its licensing here.
[[annotations]]
path = "packaging/macos/Info.plist"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# Third-party skills retain their upstream copyright and license notices.
[[annotations]]
path = [".agents/skills/gpui-kit/**", ".agents/skills/gpui-kit-design-guides/**"]
SPDX-FileCopyrightText = "2024 - 2026 Longbridge <https://longbridge.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".agents/skills/cargo-workflows/**"
SPDX-FileCopyrightText = "2026 Nikita Pochaev"
SPDX-License-Identifier = "BSD-3-Clause"
