# REUSE 3.3 configuration.
#
# Most files carry their own SPDX tags. This file covers exceptions such as
# the root README, generated lockfiles, and formats without comment syntax.

version = 1

# The root README contains only the project title.
[[annotations]]
path = "README.md"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "Cargo.lock"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "flake.lock"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "pnpm-lock.yaml"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
  "apps/core/mc_version/**",
  "apps/core/spi/src/mc_version.rs",
  "tests/apps/core/mc_version/**",
  "tests/apps/core/spi/src/mc_version.rs",
  "tests/apps/frontend/src/modpacks/service.rs",
]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
  "apps/core/lib/**",
  "apps/core/network/src/metadata.rs",
  "apps/core/install/src/loader.rs",
  "apps/core/install/src/prepare.rs",
  "apps/core/install/src/vanilla.rs",
  "apps/core/spi/download/**",
  "apps/core/spi/network/Cargo.toml",
  "apps/core/spi/network/src/lib.rs",
  "apps/core/spi/src/credentials.rs",
  "platforms/entry.rs",
  "scripts/desktop.ts",
  "tests/apps/core/lib/**",
  "apps/core/src/desktop/instance_settings.rs",
  "apps/frontend/src/panel/memory_edits.rs",
  "tests/apps/core/src/desktop/instance_settings.rs",
  "tests/apps/core/state/src/profile/update.rs",
  "tests/apps/frontend/src/panel/memory_edits.rs",
  "tests/tests/embedded_workers.rs",
  "tests/tests/embedded_workers/**",
  "tests/tests/unsafe_boundaries.rs",
]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
  ".agents/docs/filesystem-paths.md",
  "apps/core/storage/layout/**",
  "apps/core/storage/src/device_user.rs",
  "tests/apps/core/storage/src/device_user.rs",
  "tests/apps/core/storage/layout/**",
  "tests/apps/frontend/src/panel/instances.rs",
  "tests/apps/frontend/src/panel/accounts.rs",
  "tests/tests/filesystem_paths.rs",
  "tests/tests/filesystem_paths/rules.rs",
]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# JSON cannot carry comments. turbo.jsonc is listed separately below because it
# is JSONC and does accept `//`.
[[annotations]]
path = ["package.json", "**/package.json", "tsconfig.json"]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# Dotfiles whose tooling rejects leading comments (npm reads .npmrc strictly as
# key=value) or that are matched by exact name in several places.
[[annotations]]
path = [".npmrc", ".editorconfig", ".gitattributes", ".gitignore"]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
  ".env.example",
  "apps/core/content/src/curseforge.rs",
  "apps/core/content/src/curseforge/**",
  "apps/core/spi/src/curseforge.rs",
  "apps/core/src/desktop/curseforge.rs",
  "apps/core/src/secrets.rs",
  "tests/apps/core/content/src/curseforge.rs",
  "tests/apps/core/src/secrets.rs",
  "tests/tests/curseforge_secret_boundary.rs",
]
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# deslop-please rewrites this file from scratch on --update-allow, so a header
# inside it would be lost.
[[annotations]]
path = ".deslop-please.allow"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# XML: a comment before the XML declaration is illegal, so the bundle metadata
# carries its licensing here.
[[annotations]]
path = "packaging/macos/Info.plist"
SPDX-FileCopyrightText = "2026 Axolotl Team"
SPDX-License-Identifier = "GPL-3.0-only"

# The original Axolotl Launcher application icons are imported unchanged.
[[annotations]]
path = "packaging/icons/axolotl-launcher.*"
SPDX-FileCopyrightText = "2026 Garbage Human Studio"
SPDX-License-Identifier = "GPL-3.0-only"

# Third-party skills retain their upstream copyright and license notices.
[[annotations]]
path = [".agents/skills/gpui-kit/**", ".agents/skills/gpui-kit-design-guides/**"]
SPDX-FileCopyrightText = "2024 - 2026 Longbridge <https://longbridge.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".agents/skills/cargo-workflows/**"
SPDX-FileCopyrightText = "2026 Nikita Pochaev"
SPDX-License-Identifier = "BSD-3-Clause"
